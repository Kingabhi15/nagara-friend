<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAGARA-AI - Smart Complaint System</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:20px}
.card{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{text-align:center;color:#1a73e8}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#0d62c9}
.success{display:none;background:#d4edda;color:#155724;padding:12px;border-radius:8px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>🏙️ NAGARA-AI</h1>
<p style="text-align:center">Smart City Complaint System - SIH 2025</p>

<input type="text" id="name" placeholder="Your Name *" required>
<input type="tel" id="phone" placeholder="Phone Number *" required>
<select id="category">
<option value="Road Damage">Road Damage</option>
<option value="Garbage">Garbage Issue</option>
<option value="Street Light">Street Light</option>
<option value="Water Leakage">Water Leakage</option>
<option value="Drainage">Drainage</option>
</select>
<textarea id="desc" placeholder="Describe issue...*" rows="4" required></textarea>
<input type="text" id="location" placeholder="Location / Area *" required>

<button onclick="submitComplaint()" id="btn">SUBMIT TO GOOGLE SHEET</button>
<div id="msg" class="success">✅ COMPLAINT FILED! Check Google Sheet!</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYppLF6X8rYGeYZUzdf4x_inIVNWLnV2pco1wXUE36cnv1p0CZrKUiOhKhDg4uQ4tsNw/exec";

async function submitComplaint(){
 const btn = document.getElementById('btn');
 const name = document.getElementById('name').value;
 const phone = document.getElementById('phone').value;
 const category = document.getElementById('category').value;
 const desc = document.getElementById('desc').value;
 const location = document.getElementById('location').value;

 if(!name || !phone || !desc || !location){ alert("Fill all fields bro!"); return; }

 btn.innerText = "Submitting...";
 btn.disabled = true;

 const data = { name, phone, category, description: desc, location, date: new Date().toLocaleString() };

 try{
   await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
   document.getElementById('msg').style.display = 'block';
   btn.innerText = "✅ SUBMITTED!";
   setTimeout(()=>{ 
     document.getElementById('name').value=''; 
     document.getElementById('phone').value=''; 
     document.getElementById('desc').value=''; 
     document.getElementById('location').value=''; 
     btn.innerText='SUBMIT TO GOOGLE SHEET'; 
     btn.disabled=false; 
     document.getElementById('msg').style.display='none';
   }, 3000);
 }catch(e){
   alert("Error! Check Script deployment - set to Anyone");
   btn.innerText = "SUBMIT TO GOOGLE SHEET";
   btn.disabled = false;
 }
}
</script>
</body>
</html>
